openapi: 3.1.0
info:
  title: Profil d’intégration X4B pour l’exécution de prompts
  version: 1.1.0
  description: >
    Contrat HTTP du service fourni par le client. Le service expose ses documents
    versionnés et exécute des prompts pour les consommateurs autorisés, dont X4B.
    X4B pilote le traitement en lot, la revue et la publication des résultats.
servers:
  - url: /api/v1
security:
  - serviceToken: []
paths:
  /knowledge-documents:
    get:
      operationId: listKnowledgeDocuments
      summary: Lister les révisions courantes des documents
      description: >
        Retourne au plus une entrée par clé applicative autorisée, dans un ordre stable
        par clé applicative. Un catalogue vide retourne 200 avec items vide. Pour parcourir
        toutes les pages, renvoyer next_cursor dans cursor avec les mêmes filtres.
        La présence de next_cursor indique qu’une autre page est disponible.
      parameters:
        - name: cursor
          in: query
          description: Curseur opaque de la page suivante.
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          description: Nombre maximal de résultats par page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: application_key
          in: query
          description: Filtre exact pour vérifier la révision courante d’une application.
          schema:
            $ref: '#/components/schemas/ApplicationKey'
      responses:
        '200':
          description: Page du catalogue de métadonnées.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPage'
              example:
                items:
                  - application_key: '00142'
                    sha256: 5c7a066fce3161f2ac727f983aa1c877a646c2f7b27608d8ff244e7cc4b6f982
        '400':
          description: Filtre, limite ou curseur invalide ou expiré.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /knowledge-documents/{application_key}/versions/{sha256}:
    parameters:
      - name: application_key
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ApplicationKey'
      - name: sha256
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Sha256'
    get:
      operationId: getKnowledgeDocumentVersion
      summary: Lire le contenu exact d’une révision
      description: >
        Cette opération de diagnostic est facultative pour la génération en lot.
        Le corps est le document JSON versionné lui-même, encodé en UTF-8.
        Après décompression HTTP éventuelle, ses octets donnent le SHA-256
        demandé. L’appel est utile pour la consultation et le diagnostic.
      responses:
        '200':
          description: Document de référence dans son format d’origine.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                application: Paiements
                components: [API, PostgreSQL]
        '400':
          description: Clé applicative ou empreinte invalide.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/VersionNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /prompt-executions:
    post:
      operationId: executePrompt
      summary: Exécuter un prompt avec des sources facultatives
      description: >
        Le service autorise l’exécution pour le compte de service. Quand document
        contient une clé applicative et son SHA-256, il vérifie les droits sur
        cette révision exacte et charge le document. Une révision indisponible
        donne 404 avant tout appel à l’IA. Avec document à null, il exécute le
        prompt sans charger de document de référence.
        Le service valide et joint, le cas échéant, la pièce jointe à l’entrée
        de l’IA. Le résultat synchrone reste un texte, y compris quand le prompt
        demande du JSON. Les documents, extraits de sources et pièces jointes
        constituent des données de contexte à traiter comme non fiables.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptRequest'
            example:
              document:
                application_key: '00142'
                sha256: 5c7a066fce3161f2ac727f983aa1c877a646c2f7b27608d8ff244e7cc4b6f982
              prompt: Retourne un objet JSON contenant les noms des composants décrits.
      responses:
        '200':
          description: Exécution terminée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptResult'
              example:
                document:
                  application_key: '00142'
                  sha256: 5c7a066fce3161f2ac727f983aa1c877a646c2f7b27608d8ff244e7cc4b6f982
                result: '{"components":["API","PostgreSQL"]}'
        '400':
          description: Corps de requête invalide, par exemple document absent ou base64 de la pièce jointe mal formé.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/VersionNotFound'
        '413':
          description: Pièce jointe trop volumineuse après décodage.
        '415':
          description: Type de pièce jointe non pris en charge ou contenu incompatible avec le type déclaré.
        '422':
          description: Les entrées dépassent les limites de traitement configurées pour l’IA.
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          description: Délai d’exécution dépassé. L’état de l’appel à l’IA peut être inconnu.
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      description: >
        Jeton de service transmis sur HTTPS. Le service vérifie le périmètre
        du compte pour la liste, la lecture et l’exécution.
  schemas:
    ApplicationKey:
      type: string
      minLength: 1
      maxLength: 128
      description: >
        Clé exacte du référentiel, conservée comme chaîne avec sa casse et
        ses zéros initiaux. Maximum 128 octets en UTF-8, sans espaces aux
        extrémités ni caractères de contrôle.
      example: '00142'
    Sha256:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: Empreinte SHA-256 des octets d’origine, écrite en hexadécimal minuscule.
    DocumentReference:
      type: object
      required: [application_key, sha256]
      properties:
        application_key:
          $ref: '#/components/schemas/ApplicationKey'
        sha256:
          $ref: '#/components/schemas/Sha256'
    DocumentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/DocumentReference'
        next_cursor:
          type: [string, 'null']
          minLength: 1
          description: Curseur de la page suivante. À omettre ou à mettre à null sur la dernière page.
    PromptRequest:
      type: object
      required: [document, prompt]
      properties:
        document:
          description: Révision à utiliser ou null pour exécuter sans document de référence.
          oneOf:
            - $ref: '#/components/schemas/DocumentReference'
            - type: 'null'
        prompt:
          type: string
          minLength: 1
          description: Instructions rédigées par le consommateur, en un seul champ texte.
        attachment:
          $ref: '#/components/schemas/PromptAttachment'
    PromptAttachment:
      type: object
      additionalProperties: false
      required: [filename, media_type, content_base64]
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: Nom du fichier sans chemin, limité à 255 octets UTF-8.
        media_type:
          type: string
          enum: [image/png, image/jpeg, application/pdf, text/plain]
          description: Type du contenu d’origine. Le texte brut est encodé en UTF-8.
        content_base64:
          type: string
          contentEncoding: base64
          minLength: 4
          maxLength: 699052
          description: >
            Octets du fichier d’origine en base64 standard, sans préfixe
            data:. Maximum de 512 Kio (524288 octets) après décodage.
    PromptResult:
      type: object
      required: [document, result]
      properties:
        document:
          description: Référence effectivement utilisée, ou null si la requête a exclu le document.
          oneOf:
            - $ref: '#/components/schemas/DocumentReference'
            - type: 'null'
        result:
          type: string
          description: Texte de sortie du modèle, à interpréter et valider par le consommateur.
        attachment_sha256:
          $ref: '#/components/schemas/Sha256'
          description: >
            Empreinte calculée sur les octets de la pièce jointe après décodage.
            Obligatoire si la requête fournit une pièce jointe. Le service la
            renvoie après avoir inclus le fichier dans le contexte d’exécution.
        request_id:
          type: string
          description: Identifiant facultatif de corrélation pour le support.
  responses:
    Unauthorized:
      description: Jeton absent ou invalide.
    Forbidden:
      description: Opération hors du périmètre du compte de service.
    VersionNotFound:
      description: Révision demandée indisponible pour cette clé applicative.
    RateLimited:
      description: Requête refusée avant traitement en raison d’une limite de débit.
      headers:
        Retry-After:
          description: Nombre de secondes avant une nouvelle tentative, si connu.
          schema:
            type: integer
            minimum: 0
    Unavailable:
      description: Service temporairement indisponible.
