# Customer Docker Compose deployment. Run it from the docker/ directory of
# appcontrol-compose.tar.gz so nginx/nginx.conf is available. Copy
# .env.example to .env and replace every CHANGE_* value before starting.
#
# Usage:
#   docker compose -f docker-compose.release.yaml up -d
#
#   # Trust the self-signed CA (required for browser login):
#   ./trust-ca.sh
#   # Then restart your browser
#
#   open https://localhost
#   Login: values of SEED_ADMIN_EMAIL / SEED_ADMIN_PASSWORD in .env
#
#   # Pin a specific version:
#   APPCONTROL_VERSION=1.2.3 docker compose -f docker-compose.release.yaml up -d
#
#   # Tear down:
#   docker compose -f docker-compose.release.yaml down
#
# Note: The self-signed CA must be trusted by your browser for HTTPS to work.
# Without it, the login page loads but API calls fail with certificate errors.

# Override the version with: APPCONTROL_VERSION=x.y.z docker compose ... up -d
# Defaults to "latest" if not set.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appcontrol
      POSTGRES_USER: appcontrol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appcontrol"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ${APPCONTROL_IMAGE_PREFIX:-ghcr.io/xcomponent/appcontrol}-backend:${APPCONTROL_VERSION:-latest}
    expose:
      - "3000"
    environment:
      # Optional native knowledge extraction. Empty values keep model extraction unavailable.
      KNOWLEDGE_ANTHROPIC_API_KEY: ${KNOWLEDGE_ANTHROPIC_API_KEY:-}
      KNOWLEDGE_ANTHROPIC_MODEL: ${KNOWLEDGE_ANTHROPIC_MODEL:-}
      DATABASE_URL: postgres://appcontrol:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/appcontrol
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      RUST_LOG: info,appcontrol_backend=debug
      CERT_EXPORT_PATH: /certs
      # ── Initial admin user (created on first start) ──
      SEED_ENABLED: ${SEED_ENABLED:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@localhost}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in .env}
      SEED_ADMIN_DISPLAY_NAME: ${SEED_ADMIN_DISPLAY_NAME:-Admin}
      SEED_ORG_NAME: ${SEED_ORG_NAME:-Default Organization}
      SEED_ORG_SLUG: ${SEED_ORG_SLUG:-default}
      # ── SSO (optional) ──
      # OIDC_DISCOVERY_URL: https://login.example.com/.well-known/openid-configuration
      # OIDC_CLIENT_ID: appcontrol
      # OIDC_CLIENT_SECRET: your-secret
      # SAML_IDP_SSO_URL: https://idp.example.com/sso
      # ── Public URLs for enrollment commands (optional) ──
      # PUBLIC_GATEWAY_URL: wss://gateway.company.com:4443
      # PUBLIC_BACKEND_URL: wss://backend.company.com/ws/gateway
    volumes:
      - certs:/certs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/appcontrol-backend", "--health-check-url", "http://localhost:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  frontend:
    image: ${APPCONTROL_IMAGE_PREFIX:-ghcr.io/xcomponent/appcontrol}-frontend:${APPCONTROL_VERSION:-latest}
    expose:
      - "8080"
    depends_on:
      - backend

  gateway:
    image: ${APPCONTROL_IMAGE_PREFIX:-ghcr.io/xcomponent/appcontrol}-gateway:${APPCONTROL_VERSION:-latest}
    ports:
      - "4443:4443"  # Exposed directly for agent connections
    environment:
      GATEWAY_NAME: gateway-default
      GATEWAY_ZONE: default
      LISTEN_ADDR: "0.0.0.0"
      LISTEN_PORT: "4443"
      BACKEND_URL: ws://backend:3000/ws/gateway
      RUST_LOG: info,appcontrol_gateway=debug
      # mTLS certificates (generated by init-certs from backend PKI)
      TLS_CERT_FILE: /certs/gateway.crt
      TLS_KEY_FILE: /certs/gateway.key
      TLS_CA_FILE: /certs/pki-ca.crt
    volumes:
      - certs:/certs:ro
    depends_on:
      init-certs:
        condition: service_completed_successfully

  # Certificate initialization container
  init-certs:
    image: ${APPCONTROL_IMAGE_PREFIX:-ghcr.io/xcomponent/appcontrol}-init-certs:${APPCONTROL_VERSION:-latest}
    environment:
      CERT_DIR: /certs
      BACKEND_URL: http://backend:3000
      SERVER_CN: localhost
      EXTRA_SANS: appcontrol,nginx
      GATEWAY_CN: gateway
      # Credentials for gateway cert generation (uses same as backend seed)
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@localhost}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in .env}
    volumes:
      - certs:/certs
    depends_on:
      backend:
        condition: service_healthy

  # Nginx reverse proxy with TLS termination (web UI + API only)
  # Note: Agents connect directly to gateway:4443, NOT through nginx
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certs:/certs:ro
    depends_on:
      init-certs:
        condition: service_completed_successfully
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  certs:
